<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heritage Travels • Budget Matcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Logo -->
    <header class="logo-header" onclick="resetView()">
        <svg class="map-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 20L3 17V4L9 7M9 20L15 17M9 20V7M15 17L21 20V7L15 4M15 17V4M9 7L15 4" stroke="#4a86e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="9" r="3" fill="#ea4335"/>
        </svg>
        <span class="logo-text">Heritage Travels • Budget Matcher</span>
    </header>

    <!-- View 1: Search Form -->
    <main id="searchView" class="view-section active">
        <div class="hero-text">
            <h1>Where does your<br><span class="highlight">budget take you?</span></h1>
            <p>Discover gentle escapes matched to your<br>travel budget and trip length.</p>
        </div>

        <div class="search-card">
            <div class="input-row">
                <div class="input-group">
                    <label>TOTAL BUDGET</label>
                    <input type="number" id="budgetInput" placeholder="2 500">
                </div>
                <div class="input-group">
                    <label>DURATION</label>
                    <div class="input-suffix">
                        <input type="number" id="durationInput" placeholder="7">
                        <span class="suffix">days</span>
                    </div>
                </div>
            </div>
            <button onclick="findMatches()" class="primary-btn">Find Matches</button>
        </div>
        
        <p class="footer-note">Prices are estimated daily averages • Always verify before booking</p>
    </main>

    <!-- View 2: Results Grid -->
    <main id="resultsView" class="view-section" style="display: none;">
        <div class="hero-text results-hero">
            <h1 class="highlight">Your Matches</h1>
            <p class="results-count"><span id="matchCount">0</span> DESTINATIONS</p>
        </div>

        <div class="cards-grid" id="cardsGrid">
            <!-- Cards populated by JavaScript -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
